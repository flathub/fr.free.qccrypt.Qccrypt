app-id: fr.free.qccrypt.Qccrypt
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
command: qccrypt
rename-desktop-file: qccrypt.desktop
rename-icon: qccrypt
finish-args:
  - --filesystem=host
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  - --device=dri
modules:
  - name: ccrypt
    buildsystem: autotools
    sources:
      - type: archive
        url: https://ccrypt.sourceforge.net/download/1.11/ccrypt-1.11.tar.gz
        sha256: b19c47500a96ee5fbd820f704c912f6efcc42b638c0a6aa7a4e3dc0a6b51a44f
  - name: qccrypt
    buildsystem: qmake
    sources:
      - type: archive
        url: http://qccrypt.free.fr/download/qccrypt-1.0.0-src.zip
        sha256: c5ddd50da233f61c3e03fc8b8ac8323babb60da0fa287d6527c9491eead28242
